    function cancers(){const tissues=[...new Set(Object.values(A.cancers).map(c=>c[1]))];return head("Cancer Types","Cancer Explorer","Source-aware introductions to selected cancer types. These summaries are educational and not diagnostic.")+`<section class="wrap section"><div class="toolbar"><label><span class="hidden">Search cancer types</span><input class="input" id="cancer-search" placeholder="Search cancer types, genes or pathways"></label><select class="select" id="cancer-filter"><option value="">All affected tissues</option>${tissues.map(t=>`<option>${esc(t)}</option>`).join("")}</select></div><div class="body-layout"><div class="panel body-map"><p class="topline">ANATOMICAL DATA VIEW</p><svg viewBox="0 0 340 540" aria-label="Interactive anatomical cancer map"><path d="M170 48c-42 0-58 41-48 77l15 45-12 245 45 75 45-75-12-245 15-45c10-36-6-77-48-77z" fill="var(--surface2)" stroke="var(--line)" stroke-width="2"/>${[["brain",170,74,"Brain"],["lung",142,165,"Lung"],["breast",198,185,"Breast"],["liver",145,238,"Liver"],["kidney",145,270,"Kidney"],["pancreatic",190,272,"Pancreas"],["colorectal",170,315,"Colon"],["ovarian",142,372,"Ovary"],["prostate",195,390,"Prostate"]].map(o=>`<g tabindex="0" role="button" class="body-organ" data-organ="${o[0]}" aria-label="${o[3]}"><circle class="organ" cx="${o[1]}" cy="${o[2]}" r="8"/><text class="organ-label" x="${o[1]+11}" y="${o[2]+3}">${o[3]}</text></g>`).join("")}</svg></div><div><div id="organ-info" class="panel explanation">Select an anatomical marker to open an associated cancer overview.</div><div class="grid two" id="cancer-cards">${Object.entries(A.cancers).map(([id,c])=>card(id,c)).join("")}</div></div></div></section>`}

    function dataLab(){const rows=Object.entries(A.cancers).map(([id,c],i)=>[c[0],c[1],["MAPK","PI3K","DNA repair","Immune","Cell cycle"][i%5],["Variant","Amplification","Fusion","Epigenetic","Copy-number"][i%5],[62,44,76,34,55][i%5]]);return head("Data Lab","Educational Data Lab","Illustrative datasets for learning only. They are not patient data, clinical results or research findings.")+`<section class="wrap section"><p class="sample">SAMPLE DATA — illustrative values only; not clinical or research results.</p><div class="toolbar"><label><span class="hidden">Filter sample data</span><input id="data-search" class="input" placeholder="Filter cancer, tissue or pathway"></label><select id="data-filter" class="select"><option value="">All pathways</option><option>MAPK</option><option>PI3K</option><option>DNA repair</option><option>Immune</option><option>Cell cycle</option></select><button class="btn" data-chart="bar" type="button">BAR CHART</button><button class="btn" data-chart="line" type="button">LINE CHART</button></div><div class="panel chart" id="chart"></div><div class="panel table-wrap"><table class="data-table"><thead><tr>${["CANCER TYPE","AFFECTED TISSUE","SAMPLE PATHWAY","MUTATION CATEGORY","ILLUSTRATIVE SCORE"].map((h,i)=>`<th><button data-sort="${i}" type="button">${h} ↕</button></th>`).join("")}</tr></thead><tbody id="sample-table">${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`}

    function searchItems(){return [...A.topics.map(x=>({cat:"LEARN",title:x[0],desc:x[1],route:"learn.html"})),...Object.entries(A.cancers).map(([id,c])=>({cat:"CANCER TYPE",title:c[0],desc:`${c[1]}. ${c[2]} ${c[3]}`,route:`cancer.html?id=${id}`})),...Object.entries(A.genes).map(([id,g])=>({cat:"GENE",title:id,desc:`${g[0]}. ${g[1]}`,route:`gene.html?id=${id}`})),...A.drugConcepts.map(x=>({cat:"DRUG DISCOVERY",title:x[0],desc:x[1],route:"drugs.html"}))]}

    globalSearch?.addEventListener("keydown",e=>{if(e.key==="Enter"){location.hash=`search.html?q=${encodeURIComponent(globalSearch.value)}`;suggestions?.classList.add("hidden");globalSearch.blur()}});
    $("#theme-toggle")?.addEventListener("click",()=>{const next=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=next;try{localStorage.setItem("atlas-theme",next)}catch{}});
    try{document.documentElement.dataset.theme=localStorage.getItem("atlas-theme")||"dark"}catch{document.documentElement.dataset.theme="dark"}
    $("#menu-toggle")?.addEventListener("click",()=>{const open=mobileNav.classList.toggle("open");$("#menu-toggle").setAttribute("aria-expanded",String(open))});
    $("#backtop")?.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

    window.addEventListener("hashchange",render);
    render();
  })();
  </script>
 
</body></html>
